[project]
name = "starsavior-make10-helper"
version = "0.1.0"
description = "Star Savior 數字10消除遊戲視覺輔助提示器（僅分析畫面並提示，不操作遊戲）"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyQt6>=6.6",
    "mss>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "windows-capture>=2.0.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["dist", "build", "__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
